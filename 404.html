<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGO - NOT FOUND</title>
    
    <!-- Supabase Client to check session state -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           DYNAMIC THEME TOKENS (Synced with User)
           ========================================= */
        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --text-main: #090d16;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.12);
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
            --grid-line: rgba(0, 0, 0, 0.05);
        }

        :root[data-theme="dark"] {
            --bg-color: #000000;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --border-color: #121216;
            --card-bg: #050508;
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.95);
            --grid-line: rgba(59, 130, 246, 0.09);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                              linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        .error-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .error-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .error-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 2.2;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.93rem;
            line-height: 1.6;
            margin-bottom: 2rem; /* slightly larger margin to separate from the button */
        }

        /* Replaced the status pill with a styled action button */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .action-button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .action-button:active {
            transform: translateY(1px);
        }

        .action-button svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
        }
    </style>

    <script>
        // Default to Light Mode if not signed up or if light mode is selected
        const SUPABASE_URL = 'https://uxhkeswhlkktycbjitnq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4aGtlc3dobGtrdHljYmppdG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTQ1MjAsImV4cCI6MjEwMjg5MDUyMH0.z5BA_7NFc1PZ5W-L55PFEzahm56J5ar1jCYeMacOnyU';
        
        async function applyTheme() {
            try {
                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data: { session } } = await client.auth.getSession();
                
                if (!session || !session.user) {
                    document.documentElement.setAttribute('data-theme', 'light');
                    return;
                }

                const savedTheme = localStorage.getItem(`theme_${session.user.id}`) || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        }
        applyTheme();
    </script>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">
            <!-- File with an X icon to signify a broken link/404 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="9.5" y1="12.5" x2="14.5" y2="17.5"/>

        <a href="index.html" class="action-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to CodeGO
        </a>
    </div>

    <script>
        // Optional: Keep the DevTools block from your original file, 
        // but removed the automatic redirect logic so they can actually click the button.
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
